        .lightbox-btn .material-symbols-outlined {

        .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }

        .lightbox-counter {

        .lightbox-info {

        .lightbox-info dd {

        .lightbox-empty {

        body.lightbox-lock {
            overflow: hidden;
        }

		
        @media (max-width: 768px) {
            .works-layout {
                grid-template-columns: 1fr;

            }

            .works-toolbar .works-view button:last-child {
                border-right: none;

            .works-sort {
                flex-direction: column;

                font-size: 12px;
            }

            .works-table th,

            .works-table th {

            }

            .works-table td:first-child {
                padding-left: 0;
            }

            /* Year and size only break at spaces, never inside numbers */
            .works-table .col-keep {
                overflow-wrap: normal;

            .works-container {

            .lightbox {

        /* Mobile Styles */

            }

            .works-submenu button:last-child {
                border-bottom: none;
            }

            .work-modal-content {
                padding: 20px;

    <main>


		
        <!-- Works Page -->
        <div id="works" class="page">
            <div class="works-container">
                <div class="works-layout">

                    <!-- Filters sidebar -->
                    <aside class="works-sidebar" id="works-sidebar">
                        <div class="works-sidebar-head">
                            <span class="material-symbols-outlined">tune</span> filters
                        </div>
                        <div class="works-filters" id="works-filters">
                            <!-- Filters are generated from the works data by JavaScript -->
                        </div>
                    </aside>

                    <div class="works-main">
                        <div class="works-toolbar">
                            <div class="works-toolbar-left">
                                <button class="works-filter-toggle" onclick="toggleWorkFilters()">
                                    <span class="material-symbols-outlined">tune</span> filters
                                </button>
                                <div class="works-submenu works-view">
                                    <button data-view="grid" onclick="setView('grid')">
                                        <span class="material-symbols-outlined">grid_view</span> image grid
                                    </button>
                                    <button class="active" data-view="table" onclick="setView('table')">
                                        <span class="material-symbols-outlined">table_rows</span> image table
                                    </button>
                                </div>
                                <span class="works-count" id="works-count"></span>
                            </div>
                            <label class="works-field works-sort">
                                <span class="material-symbols-outlined">sort</span>
                                <select id="works-sort" onchange="setSort(this.value)" aria-label="sort by">
                                    <option value="year-asc">chronological (oldest first)</option>
                                    <option value="year-desc" selected>chronological (newest first)</option>
                                    <option value="title-asc">alphabetical (A–Z)</option>
                                    <option value="title-desc">alphabetical (Z–A)</option>
                                </select>
                            </label>
                        </div>

                        <div class="works-grid" id="works-grid" style="display: none;">
                            <!-- Works will be generated by JavaScript -->
                        </div>

                        <div class="works-table-wrap" id="works-table-wrap">
                            <table class="works-table">
                                <thead>
                                    <tr>
                                        <th>image</th>
                                        <th>title</th>
                                        <th class="col-keep">year</th>
                                        <th class="col-keep">technique</th>
                                        <th class="col-hide-sm">medium / support</th>
                                        <th class="col-hide-sm">size (cm)</th>
                                        <th class="col-hide-sm">event</th>
                                        <th class="col-hide-sm">availability</th>
                                    </tr>
                                </thead>
                                <tbody id="works-table-body"></tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>


    </main>

    <!-- Work Lightbox -->
    <div id="work-modal" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
        <div class="lightbox-stage" id="lightbox-stage">
            <span class="lightbox-counter" id="lightbox-counter"></span>
            <div id="lightbox-media"></div>
            <button class="lightbox-btn lightbox-prev" onclick="stepLightbox(-1)" aria-label="previous work">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <button class="lightbox-btn lightbox-next" onclick="stepLightbox(1)" aria-label="next work">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
            <button class="lightbox-btn lightbox-close" onclick="closeWorkModal()" aria-label="close">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="lightbox-info">
            <h3 id="lightbox-title"></h3>
            <div class="lightbox-year" id="lightbox-year"></div>
            <dl id="lightbox-details"></dl>
        </div>
    </div>

`       ;

        // ===== CSV LOADING =====
        // 1. The page first tries to load CSV_FILE (same folder as this page, e.g. on GitHub Pages).
        // 2. If that fails (e.g. page opened with file://), it uses the CSV pasted in WORKS_CSV above.
        const CSV_FILE = 'archive_gefercan.csv';

        // Used when an image column holds only a file name (e.g. "tondo.jpeg")
        const IMAGE_BASE = 'https://gefercan.github.io/images/archive/';
        const LIGHTBOX_FOLDER = 'lightbox/';
        const THUMBNAIL_FOLDER = 'thumbnails/';

        // Header text -> field name. First match wins, so the more specific checks come first.
        const COLUMN_RULES = [
            ['thumbnail',    h => h.includes('thumb')],
            ['lightbox',     h => h.includes('lightbox') || h.startsWith('image') || h === 'jpeg'],
            ['height',       h => h.includes('height')],
            ['width',        h => h.includes('width')],
            ['print',        h => h.includes('print')],
            ['availability', h => h.includes('availab')],
            ['year',         h => h === 'year'],
            ['title',        h => h.includes('title')],
            ['event',        h => h.includes('event')],
            ['technique',    h => h.includes('technique')],
            ['medium',       h => h.includes('medium')],
            ['support',      h => h.includes('support')],
            ['category',     h => h.includes('category')],
            ['price',        h => h.includes('price')],
            ['commentary',   h => h.includes('comment')],
            ['keywords',     h => h.includes('keyword')]
        ];
        // Standard column order of archive_gefercan.csv (used if no header row is found)
        const FIELD_ORDER = ['year', 'title', 'event', 'height', 'width', 'technique', 'medium', 'support',
                             'category', 'availability', 'lightbox', 'thumbnail', 'print', 'price', 'commentary', 'keywords'];

        // Split one CSV line into fields (supports "quoted, values" and "" escapes)
        function splitCsvRow(row) {
            const out = [];
            let cur = '', quoted = false;
            for (let i = 0; i < row.length; i++) {
                const ch = row[i];
                if (ch === '"' && quoted && row[i + 1] === '"') { cur += '"'; i++; }
                else if (ch === '"') quoted = !quoted;
                else if (ch === ',' && !quoted) { out.push(cur.trim()); cur = ''; }
                else cur += ch;
            }
            out.push(cur.trim());
            return out;
        }

        // Turns whatever is in an image cell into a usable URL, or '' for "no image"
        function resolveImageUrl(value, folder) {
            let src = String(value || '').trim().replace(/^"|"$/g, '');
            if (!src) return '';
            src = src.replace(/,(jpe?g|png|webp|gif|avif)$/i, '.$1');           // typo "name,jpeg"
            if (!/\.(jpe?g|png|webp|gif|avif)(\?.*)?$/i.test(src)) return '';   // folder only / not an image
            if (/^(https?:)?\/\//i.test(src) || src.startsWith('/') || src.startsWith('./') || src.startsWith('data:')) return src;
            if (/^[\w-]+(\.[\w-]+)+\//.test(src)) return 'https://' + src;     // "gefercan.github.io/..." without https://
            if (src.includes('/')) return src;                                   // relative path, e.g. "images/x.jpeg"
            return IMAGE_BASE + folder + src;                                    // bare file name
        }

        // Converts CSV text into the works list used by the page
        function csvToWorks(csvText) {
            const lines = String(csvText).replace(/^﻿/, '').replace(/\r/g, '')
                .split('\n').map(l => l.trim()).filter(l => l !== '');

            // Skip anything before the header row (e.g. e-mail text pasted along with the CSV)
            let start = lines.findIndex(l => /^"?year"?\s*,/i.test(l));
            const hasHeader = start !== -1;
            if (!hasHeader) start = lines.findIndex(l => /^\d{4}\s*,/.test(l));
            if (start === -1) return [];

            // Re-join lines that were wrapped: every work starts with a 4-digit year
            let header = '';
            const records = [];
            lines.slice(start).forEach((line, i) => {
                if (/^\d{4}\s*,/.test(line)) records.push(line);
                else if (records.length) records[records.length - 1] += ' ' + line;
                else if (hasHeader) header += (i ? ' ' : '') + line;
            });

            let columns = FIELD_ORDER;
            if (header) {
                const found = splitCsvRow(header).map(h => {
                    const name = h.toLowerCase().replace(/\s+/g, ' ').trim();
                    const rule = COLUMN_RULES.find(([, test]) => test(name));
                    return rule ? rule[0] : null;
                });
                if (found.filter(Boolean).length >= 5) columns = found;
            }

            const fixes = { distroyed: 'destroyed' };

            return records.map(record => {
                const values = splitCsvRow(record);
                const work = {};
                FIELD_ORDER.forEach(key => work[key] = '');
                columns.forEach((key, i) => { if (key && !work[key]) work[key] = values[i] !== undefined ? values[i] : ''; });

                work.year = parseInt(work.year, 10) || work.year;
                work.height = parseFloat(work.height) || work.height;
                work.width = parseFloat(work.width) || work.width;
                if (!work.title || work.title.toLowerCase() === 'na') work.title = 'Untitled';
                const av = work.availability.toLowerCase();
                if (fixes[av]) work.availability = fixes[av];

                // Big image for the lightbox, small one for grid/table. Each falls back to the other.
                work.lightbox = resolveImageUrl(work.lightbox, LIGHTBOX_FOLDER);
                work.thumbnail = resolveImageUrl(work.thumbnail, THUMBNAIL_FOLDER);
                if (!work.thumbnail) work.thumbnail = work.lightbox;
                if (!work.lightbox) work.lightbox = work.thumbnail;
                work.image = work.thumbnail; // kept for compatibility
                return work;
            });
        }

        let works = [];

        function setWorks(list) {
            works = list;
            worksFiltersBuilt = false;
            worksState.filters = {};
            worksState.search = '';
            renderWorks();
        }

        async function loadWorks() {
            try {
                const res = await fetch(CSV_FILE + '?v=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error(res.status);
                const list = csvToWorks(await res.text());
                if (!list.length) throw new Error('empty csv');
                setWorks(list);
            } catch (err) {
                console.warn(`Could not load ${CSV_FILE} (${err.message}); using the CSV pasted in the page.`);
                setWorks(csvToWorks(WORKS_CSV));
            }
        }

        // Image that falls back to a second URL, then to the text placeholder, if it fails to load
        function imageFailed(img) {
            const fallback = img.dataset.fallback;
            if (fallback && img.src !== fallback) {
                img.dataset.fallback = '';
                img.src = fallback;
                return;
            }
            const box = img.parentElement;
            img.remove();
            if (box) {
                box.classList.remove('has-image');
                box.classList.add('image-missing');
            }
        }




        // Navigation functions
        function showPage(pageId) {
            // Hide all pages
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            // Show selected page
            document.getElementById(pageId).classList.add('active');
            
            // Update navigation
            const navLinks = document.querySelectorAll('nav a');
            navLinks.forEach(link => link.classList.remove('active'));
            
            // Close mobile menu
            document.getElementById('nav-menu').classList.remove('show');
        }

        function toggleMenu() {
            const navMenu = document.getElementById('nav-menu');
            navMenu.classList.toggle('show');
        }

        // Works functions
        const workFilters = [
            { key: 'technique', label: 'technique' },
            { key: 'year', label: 'year' },
            { key: 'medium', label: 'material' },
            { key: 'support', label: 'support' },
            { key: 'category', label: 'theme' },
            { key: 'event', label: 'event' },
            { key: 'availability', label: 'availability' }
        ];

        const worksState = { view: 'table', sort: 'year-desc', search: '', filters: {} };
        let worksFiltersBuilt = false;

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function hasValue(value) {
            return value !== undefined && value !== null && String(value).trim() !== '' && String(value).toLowerCase() !== 'na';
        }

        function workSize(work) {
            return hasValue(work.height) && hasValue(work.width) ? `${work.height} × ${work.width}` : '';
        }

        function workThumb(work, extraClass) {
            const label = `<span>${escapeHtml(work.technique)}<br>${escapeHtml(work.year)}</span>`;
            if (hasValue(work.thumbnail)) {
                const fallback = work.lightbox !== work.thumbnail ? escapeHtml(work.lightbox) : '';
                return `<div class="work-placeholder has-image ${extraClass}">${label}<img src="${escapeHtml(work.thumbnail)}" data-fallback="${fallback}" alt="${escapeHtml(work.title)}" loading="lazy" decoding="async" onerror="imageFailed(this)"></div>`;
            }
            return `<div class="work-placeholder ${extraClass}">${label}</div>`;
        }

        function buildWorkFilters() {
            const container = document.getElementById('works-filters');
            let html = `<label class="works-field">search
                    <input type="search" id="works-search" placeholder="title, keyword…" oninput="setSearch(this.value)">
                </label>`;

            workFilters.forEach(filter => {
                const values = [...new Set(works.map(w => w[filter.key]).filter(hasValue).map(String))];
                values.sort((a, b) => filter.key === 'year' ? a - b : a.localeCompare(b, 'es', { sensitivity: 'base' }));
                const options = values.map(v => {
                    const count = works.filter(w => String(w[filter.key]) === v).length;
                    return `<option value="${escapeHtml(v)}">${escapeHtml(v)} (${count})</option>`;
                }).join('');
                html += `<label class="works-field">${filter.label}
                        <select data-filter="${filter.key}" onchange="setFilter('${filter.key}', this.value)">
                            <option value="">all</option>${options}
                        </select>
                    </label>`;
            });

            html += `<button class="works-reset" onclick="resetWorkFilters()">clear filters</button>`;
            container.innerHTML = html;
            worksFiltersBuilt = true;
        }

        function getVisibleWorks() {
            const query = worksState.search.trim().toLowerCase();
            const list = works.filter(work => {
                const matchesFilters = Object.entries(worksState.filters)
                    .every(([key, value]) => !value || String(work[key]) === value);
                if (!matchesFilters) return false;
                if (!query) return true;
                return [work.title, work.year, work.event, work.technique, work.medium, work.support, work.category, work.keywords, work.commentary]
                    .join(' ').toLowerCase().includes(query);
            });

            const byTitle = (a, b) => a.title.localeCompare(b.title, 'es', { sensitivity: 'base' });
            const byYear = (a, b) => a.year - b.year;
            const sorters = {
                'year-asc': (a, b) => byYear(a, b) || byTitle(a, b),
                'year-desc': (a, b) => byYear(b, a) || byTitle(a, b),
                'title-asc': (a, b) => byTitle(a, b) || byYear(a, b),
                'title-desc': (a, b) => byTitle(b, a) || byYear(a, b)
            };
            return list.sort(sorters[worksState.sort]);
        }

        function renderWorks() {
            if (!worksFiltersBuilt) buildWorkFilters();

            const list = getVisibleWorks();
            const grid = document.getElementById('works-grid');
            const tableWrap = document.getElementById('works-table-wrap');
            const tableBody = document.getElementById('works-table-body');

            document.getElementById('works-count').textContent =
                list.length === works.length ? `${works.length} works` : `${list.length} of ${works.length} works`;

            grid.style.display = worksState.view === 'grid' ? '' : 'none';
            tableWrap.style.display = worksState.view === 'table' ? '' : 'none';
            grid.innerHTML = '';
            tableBody.innerHTML = '';

            if (!list.length) {
                grid.style.display = '';
                tableWrap.style.display = 'none';
                grid.innerHTML = '<p class="works-empty">No works match these filters.</p>';
                return;
            }

            list.forEach(work => {
                if (worksState.view === 'grid') {
                    const item = document.createElement('div');
                    item.className = 'work-item';
                    item.tabIndex = 0;
                    item.innerHTML = `
                        ${workThumb(work, '')}
                        <div class="work-title">${escapeHtml(work.title)}</div>
                        <div class="work-year">${escapeHtml(work.year)}</div>
                    `;
                    item.onclick = () => openWorkModal(work);
                    item.onkeydown = e => { if (e.key === 'Enter') openWorkModal(work); };
                    grid.appendChild(item);
                } else {
                    const row = document.createElement('tr');
                    row.tabIndex = 0;
                    row.innerHTML = `
                        <td>${workThumb(work, 'works-thumb')}</td>
                        <td>${escapeHtml(work.title)}</td>
                        <td class="col-keep">${escapeHtml(work.year)}</td>
                        <td class="col-keep">${escapeHtml(work.technique)}</td>
                        <td class="col-hide-sm">${escapeHtml(work.medium)} on ${escapeHtml(work.support)}</td>
                        <td class="col-hide-sm col-keep">${escapeHtml(workSize(work))}</td>
                        <td class="col-hide-sm">${escapeHtml(work.event)}</td>
                        <td class="col-hide-sm">${escapeHtml(work.availability)}</td>
                    `;
                    row.onclick = () => openWorkModal(work);
                    row.onkeydown = e => { if (e.key === 'Enter') openWorkModal(work); };
                    tableBody.appendChild(row);
                }
            });
        }

        function setView(view) {
            worksState.view = view;
            document.querySelectorAll('.works-view button').forEach(btn =>
                btn.classList.toggle('active', btn.dataset.view === view));
            renderWorks();
        }

        function setSort(sort) {
            worksState.sort = sort;
            renderWorks();
        }

        function setFilter(key, value) {
            worksState.filters[key] = value;
            renderWorks();
        }

        function setSearch(value) {
            worksState.search = value;
            renderWorks();
        }

        function resetWorkFilters() {
            worksState.filters = {};
            worksState.search = '';
            document.querySelectorAll('#works-filters select').forEach(select => select.value = '');
            document.getElementById('works-search').value = '';
            renderWorks();
        }

        function toggleWorkFilters() {
            document.getElementById('works-sidebar').classList.toggle('open');
        }

        // Lightbox: browses the works currently shown (respects filters and sort)
        let lightboxList = [];
        let lightboxIndex = 0;

        function openWorkModal(work) {
            lightboxList = getVisibleWorks();
            lightboxIndex = Math.max(0, lightboxList.indexOf(work));
            renderLightbox();
            document.getElementById('work-modal').classList.add('open');
            document.body.classList.add('lightbox-lock');
            document.querySelector('.lightbox-close').focus();
        }

        function stepLightbox(direction) {
            if (!lightboxList.length) return;
            lightboxIndex = (lightboxIndex + direction + lightboxList.length) % lightboxList.length;
            renderLightbox();
        }

        function renderLightbox() {
            const work = lightboxList[lightboxIndex];
            const media = document.getElementById('lightbox-media');

            const placeholder = `<div class="lightbox-placeholder">
                        <span class="material-symbols-outlined">image</span>
                        <span>image not available yet</span>
                   </div>`;
            const showPlaceholder = () => {
                media.innerHTML = placeholder;
                media.style.cssText = 'display:contents;';
            };
            if (hasValue(work.lightbox)) {
                media.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;';
                media.innerHTML = '';
                const img = new Image();
                img.alt = work.title;
                let triedFallback = false;
                img.onerror = () => {
                    if (!triedFallback && hasValue(work.thumbnail) && work.thumbnail !== work.lightbox) {
                        triedFallback = true;
                        img.src = work.thumbnail;
                    } else if (lightboxList[lightboxIndex] === work) {
                        showPlaceholder();
                    }
                };
                img.src = work.lightbox;
                media.appendChild(img);
                // Preload neighbours so browsing feels instant
                [1, -1].forEach(d => {
                    const next = lightboxList[(lightboxIndex + d + lightboxList.length) % lightboxList.length];
                    if (next && hasValue(next.lightbox)) new Image().src = next.lightbox;
                });
            } else {
                showPlaceholder();
            }

            document.getElementById('lightbox-counter').textContent = `${lightboxIndex + 1} / ${lightboxList.length}`;
            document.getElementById('lightbox-title').textContent = work.title;
            document.getElementById('lightbox-year').textContent = work.year;

            const fields = [
                ['year', work.year],
                ['technique', work.technique],
                ['medium', work.medium],
                ['support', work.support],
                ['size', workSize(work) ? `${workSize(work)} cm (h × w)` : ''],
                ['theme', work.category],
                ['event', work.event],
                ['availability', work.availability],
                ['print available', work.print],
                ['price', work.price],
                ['commentary', work.commentary],
                ['keywords', work.keywords]
            ];
            document.getElementById('lightbox-details').innerHTML = fields
                .map(([label, value]) => `<dt>${label}</dt><dd>${hasValue(value) ? escapeHtml(value) : '<span class="lightbox-empty">—</span>'}</dd>`)
                .join('');

            const single = lightboxList.length < 2;
            document.querySelector('.lightbox-prev').style.display = single ? 'none' : '';
            document.querySelector('.lightbox-next').style.display = single ? 'none' : '';
        }

        function closeWorkModal() {
            document.getElementById('work-modal').classList.remove('open');
            document.body.classList.remove('lightbox-lock');
        }

        // Close lightbox when clicking the dark area around the work
        document.getElementById('work-modal').onclick = function(e) {
            if (e.target === this || e.target.id === 'lightbox-stage') {
                closeWorkModal();
            }
        }

        // Keyboard: Esc closes, arrows browse
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('work-modal').classList.contains('open')) return;
            if (e.key === 'Escape') closeWorkModal();
            if (e.key === 'ArrowLeft') stepLightbox(-1);
            if (e.key === 'ArrowRight') stepLightbox(1);
        });

        // Swipe on touch screens
        (function() {
            let startX = null;
            const stage = document.getElementById('lightbox-stage');
            stage.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
            stage.addEventListener('touchend', e => {
                if (startX === null) return;
                const dx = e.changedTouches[0].clientX - startX;
                if (Math.abs(dx) > 50) stepLightbox(dx < 0 ? 1 : -1);
                startX = null;
            });
        })();

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadWorks();
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', function(e) {
            const nav = document.querySelector('nav');
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.getElementById('nav-menu');
            
            if (!nav.contains(e.target) && !hamburger.contains(e.target)) {
                navMenu.classList.remove('show');
            }
        });
    </script>
</body>

</html>
